<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Focus Forest</title><link rel="stylesheet" href="style.css"></head>
<body>
  <div class="popup-ambient" aria-hidden="true"><span></span><span></span></div>
  <main class="popup-shell">
    <header class="popup-brand"><div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div><strong>Focus Forest</strong><span class="local-dot">Local</span></header>
    <section id="empty" class="empty" hidden><div class="empty-seed" aria-hidden="true"><svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><path class="sprout-stem" d="M20 36 C19 28 18 22 20 14 C21 10 22 10 22 14 C24 22 23 28 22 36"/><path class="sprout-leaf sprout-left" d="M20 22 C16 18 12 16 14 14 C16 12 20 16 20 22"/><path class="sprout-leaf sprout-right" d="M20 20 C24 16 28 14 26 12 C24 10 20 14 20 20"/></svg></div><p class="eyebrow">NO ACTIVE MISSION</p><h1>Nothing needs your attention yet.</h1><p class="empty-copy">Plant an intention here. It works in Chrome and Brave even if a new tab still shows the browser’s own page.</p><form id="plant-form" class="plant-form"><label class="visually-hidden" for="plant-input">Intention</label><input id="plant-input" type="text" maxlength="140" autocomplete="off" placeholder="What are you here to do?" required><button id="plant" type="submit">Plant intention</button></form><p id="plant-status" class="plant-status" role="status" aria-live="polite" hidden></p><button id="open-planting" class="text-action" type="button">Open the planting page</button></section>
    <section id="active" hidden>
      <p class="eyebrow">YOUR MISSION</p><h1 id="mission"></h1><p id="state" class="state-line"></p>
      <div class="branch-meter"><div class="meter-track"><span id="meter-fill"></span></div><div class="meter-labels"><span>Root</span><span id="depth-label">Branch 0</span></div></div>
      <div class="quiet-stats"><div><strong id="nodes">0</strong><span>pages in the garden</span></div><div><strong id="compost">0</strong><span>saved for later</span></div></div>
      <div class="actions"><button id="return" class="primary" type="button">Return to my mission <span aria-hidden="true">↶</span></button><button id="pause" class="secondary" type="button"></button><button id="dashboard" class="text-action" type="button">Open the garden <span aria-hidden="true">→</span></button><button id="settings" class="text-action" type="button">Tend the forest <span aria-hidden="true">↗</span></button></div>
    </section>
    <section id="completion" class="completion" role="dialog" aria-modal="true" aria-labelledby="completion-title" aria-describedby="completion-copy" hidden><p class="eyebrow">LET IT REST</p><h2 id="completion-title">This garden can rest now.</h2><p id="completion-copy"></p><div class="completion-actions"><button id="complete" class="primary" type="button">Let it rest</button><button id="keep" class="secondary" type="button">Keep tending</button><button id="review" class="text-action" type="button">Open the garden map</button></div></section>
  </main>
  <footer id="popup-footer"><span class="footer-sprig" aria-hidden="true">⌁</span><button id="end" type="button">Let this garden rest</button></footer>
  <script type="module" src="app.js"></script>
</body></html>
